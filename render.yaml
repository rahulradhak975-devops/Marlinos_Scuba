services:
  - type: web
    name: marlinos-diventures
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn scuba_site.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: scuba_site.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: marlinos-diventures.onrender.com,marlinosdiventures.com,www.marlinosdiventures.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://marlinos-diventures.onrender.com,https://marlinosdiventures.com,https://www.marlinosdiventures.com
      - key: BUSINESS_EMAIL
        value: info@marlinosdiventures.com
      - key: OWNER_EMAIL
        value: info@marlinosdiventures.com
